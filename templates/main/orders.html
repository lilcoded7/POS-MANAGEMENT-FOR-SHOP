{% extends 'main/base.html' %}
{% load static %}
{% block content %}
<div class="orders-container">
    <div class="orders-header">
        <h2>Orders Management</h2>
        <div class="order-filters">
            <div class="filter-group">
                <label for="timeFilter">Time Period:</label>
                <select id="timeFilter">
                    <option value="today">Today</option>
                    <option value="yesterday">Yesterday</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                    <option value="custom">Custom Date</option>
                </select>
            </div>
            <div class="filter-group" id="customDateFilter" style="display: none;">
                <label for="datePicker">Select Date:</label>
                <input type="date" id="datePicker">
            </div>
            <div class="filter-group">
                <label for="statusFilter">Status:</label>
                <select id="statusFilter">
                    <option value="all">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="success">Completed</option>
                    <option value="wish_list">Wish List</option>
                </select>
            </div>
            <button id="applyFilter" class="filter-btn">Apply Filters</button>
        </div>
    </div>

    <div class="order-analytics">
        <div class="card">
            <h3>Total Orders</h3>
            <div class="value" id="totalOrders">0</div>
            <div class="progress">
                <div class="progress-bar" style="width: 100%"></div>
            </div>
        </div>
        <div class="card">
            <h3>Total Sales</h3>
            <div class="value" id="totalSales">$0.00</div>
            <div class="progress">
                <div class="progress-bar" style="width: 100%"></div>
            </div>
        </div>
        <div class="card">
            <h3>Pending Orders</h3>
            <div class="value" id="pendingOrders">0</div>
            <div class="progress">
                <div class="progress-bar" style="width: 100%"></div>
            </div>
        </div>
    </div>

    <div class="orders-table">
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Items</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
                <!-- Orders will be loaded here via JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize with today's orders
    loadOrders('today', 'all');
    
    // Setup event listeners
    document.getElementById('timeFilter').addEventListener('change', function() {
        if (this.value === 'custom') {
            document.getElementById('customDateFilter').style.display = 'flex';
        } else {
            document.getElementById('customDateFilter').style.display = 'none';
        }
    });
    
    document.getElementById('applyFilter').addEventListener('click', function() {
        const timeFilter = document.getElementById('timeFilter').value;
        const statusFilter = document.getElementById('statusFilter').value;
        let dateFilter = '';
        
        if (timeFilter === 'custom') {
            dateFilter = document.getElementById('datePicker').value;
            if (!dateFilter) {
                alert('Please select a date');
                return;
            }
        }
        
        loadOrders(timeFilter, statusFilter, dateFilter);
    });
});

function loadOrders(timeFilter, statusFilter, customDate = '') {
    const params = new URLSearchParams();
    params.append('time_filter', timeFilter);
    params.append('status_filter', statusFilter);
    if (customDate) params.append('custom_date', customDate);
    
    fetch(`/orders/filter/?${params.toString()}`)
        .then(response => response.json())
        .then(data => {
            // Update analytics cards
            document.getElementById('totalOrders').textContent = data.total_orders;
            document.getElementById('totalSales').textContent = `$${parseFloat(data.total_sales).toFixed(2)}`;
            document.getElementById('pendingOrders').textContent = data.pending_orders;
            
            // Update orders table
            const tableBody = document.getElementById('ordersTableBody');
            tableBody.innerHTML = '';
            
            data.orders.forEach(order => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${order.order_id}</td>
                    <td>${order.created_at}</td>
                    <td>${order.item_count}</td>
                    <td>$${parseFloat(order.total_price).toFixed(2)}</td>
                    <td><span class="status ${order.status === 'success' ? 'completed' : order.status === 'pending' ? 'pending' : 'wishlist'}">${order.status_display}</span></td>
                    <td>
                        <div class="action-buttons">
                            <a href="#" class="view-btn" onclick="viewOrderDetails(${order.id})">
                                <i class="fas fa-eye"></i> View
                            </a>
                            ${order.status === 'pending' ? `
                            <a href="#" class="cancel-btn" onclick="cancelOrder(${order.id})">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                            ` : ''}
                            <a href="#" class="delete-btn" onclick="confirmDeleteOrder(${order.id})">
                                <i class="fas fa-trash"></i> Delete
                            </a>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        })
        .catch(error => {
            console.error('Error loading orders:', error);
            alert('Failed to load orders. Please try again.');
        });
}

function viewOrderDetails(orderId) {
    // Implement order details view
    alert('Order details for ID: ' + orderId);
}

function cancelOrder(orderId) {
    if (confirm('Are you sure you want to cancel this order?')) {
        fetch(`/orders/${orderId}/cancel/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Order canceled successfully');
                // Refresh orders
                const timeFilter = document.getElementById('timeFilter').value;
                const statusFilter = document.getElementById('statusFilter').value;
                loadOrders(timeFilter, statusFilter);
            } else {
                alert('Failed to cancel order: ' + (data.error || 'Unknown error'));
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to cancel order. Please try again.');
        });
    }
}

function confirmDeleteOrder(orderId) {
    if (confirm('Are you sure you want to delete this order? This action cannot be undone.')) {
        fetch(`/orders/${orderId}/delete/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Order deleted successfully');
                // Refresh orders
                const timeFilter = document.getElementById('timeFilter').value;
                const statusFilter = document.getElementById('statusFilter').value;
                loadOrders(timeFilter, statusFilter);
            } else {
                alert('Failed to delete order: ' + (data.error || 'Unknown error'));
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to delete order. Please try again.');
        });
    }
}
</script>

<style>
.orders-container {
    padding: 20px;
}

.orders-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
}

.order-filters {
    display: flex;
    gap: 15px;
    align-items: center;
    flex-wrap: wrap;
}

.filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
}

.filter-group label {
    font-weight: 500;
}

.filter-group select, .filter-group input {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

.filter-btn {
    padding: 8px 16px;
    background: var(--secondary);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.order-analytics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.orders-table {
    background: white;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    overflow-x: auto;
}

.orders-table table {
    width: 100%;
    border-collapse: collapse;
}

.orders-table th, .orders-table td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

.orders-table th {
    background: var(--bg);
    font-weight: 600;
}

.status {
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 500;
}

.status.completed {
    background: rgba(2, 138, 15, 0.1);
    color: var(--success);
}

.status.pending {
    background: rgba(255, 165, 0, 0.1);
    color: orange;
}

.status.wishlist {
    background: rgba(108, 92, 231, 0.1);
    color: var(--primary);
}

.action-buttons {
    display: flex;
    gap: 8px;
}

.action-buttons a {
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.8rem;
    text-decoration: none;
}

.view-btn {
    background: #f0f0f0;
    color: #333;
}

.cancel-btn {
    background: #fff0f0;
    color: #d32f2f;
}

.delete-btn {
    background: #f5f5f5;
    color: #666;
}

@media (max-width: 768px) {
    .orders-header {
        flex-direction: column;
        align-items: flex-start;
    }
    
    .order-filters {
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
    }
    
    .filter-group {
        width: 100%;
    }
    
    .filter-group select, .filter-group input {
        width: 100%;
    }
    
    .filter-btn {
        width: 100%;
    }
}
</style>
{% endblock content %}
